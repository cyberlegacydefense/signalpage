[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Next.js on Netlify requires the Next.js Runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Extend function timeout for AI-heavy endpoints (requires Pro plan for full 26s)
[functions]
  external_node_modules = ["@anthropic-ai/sdk"]

[[edge_functions]]
  path = "/api/interviewer-model/*"
  function = "interviewer-model"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
